# nixpacks.toml for Dokploy/Nixpacks
# This file ensures that environment variables are correctly passed to PHP-FPM
# and that required PHP extensions are installed.

[variables]
    NIXPACKS_PHP_EXTENSIONS = "pdo_mysql gd mbstring pdo openssl iconv xml"

[staticAssets]
"php-fpm.conf" = '''
[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 50
pm.min_spare_servers = 4
pm.max_spare_servers = 32
pm.start_servers = 18
clear_env = no
'''
